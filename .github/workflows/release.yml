name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: islandbar-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xoniksq/islandbar' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        shell: pwsh
        run: |
          $project = [xml](Get-Content -LiteralPath IslandBar.csproj -Raw)
          $base = [version]$project.Project.PropertyGroup.Version
          $version = "$($base.Major).$($base.Minor).$env:GITHUB_RUN_NUMBER"
          ./scripts/Build-Release.ps1 -Version $version -Output artifacts
          "ISLAND_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not check main' }
          if (($head -split '\s+')[0] -ne $env:GITHUB_SHA) { exit 0 }
          $tag = "v$env:ISLAND_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag artifacts/IslandBar-Windows-x64.zip artifacts/islandbar-update.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "IslandBar $env:ISLAND_VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
